[agent]
  debug = true
  interval = "10s"
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://172.20.20.17:8086"]
  token = "rcn-telemetry-token"
  organization = "rcn"
  bucket = "telemetry"

[[inputs.gnmi]]
  addresses = ["172.20.20.14:6030"]
  username = "admin"
  password = "admin"
  encoding = "json_ietf"
  redial = "10s"
  [inputs.gnmi.tags]
    device = "R1"
  [[inputs.gnmi.subscription]]
    name = "cpu"
    origin = "openconfig"
    path = "/system/cpus/cpu/state/total/instant"
    subscription_mode = "sample"
    sample_interval = "10s"
  [[inputs.gnmi.subscription]]
    name = "interfaces"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"
  [[inputs.gnmi.subscription]]
    name = "oper_status"
    origin = "openconfig"
    path = "/interfaces/interface/state/oper-status"
    subscription_mode = "sample"
    sample_interval = "10s"

